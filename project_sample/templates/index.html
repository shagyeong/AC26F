<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 이익 분배 시뮬레이터</title>
    <!-- Layout utilities and chart rendering library -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="p-6 min-h-screen flex flex-col justify-between">

    <!-- 대시보드 탑 내비게이션 바 -->
    <header class="glass-panel w-full max-w-7xl mx-auto p-4 flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                AI BENEFIT DISTRIBUTION SIMULATOR
            </h1>
            <p class="text-xs text-gray-400">인공지능 시뮬레이터 프로토타입 v1.1</p>
        </div>
        <div class="flex items-center gap-6">
            <div class="text-right">
                <span class="text-xs text-gray-500 block font-mono">TIMELINE</span>
                <span id="currentYear" class="text-xl font-black text-blue-400">1년차</span>
            </div>
            <button id="restartBtn" class="bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold px-4 py-2 rounded-lg text-sm border border-gray-700 transition">
                초기화
            </button>
        </div>
    </header>

    <!-- 대시보드 중앙 콘텐츠 영역 -->
    <main class="w-full max-w-7xl mx-auto flex flex-col gap-6 flex-grow mb-6">
        
        <!-- 상단 세션: 지표 요약 스탯 패널 -->
        <div class="glass-panel p-6 grid grid-cols-3 gap-4">
            <div class="text-center p-4 bg-gray-900/40 rounded-lg border border-gray-800">
                <span class="text-xs text-gray-400 block mb-1 font-semibold">GDP</span>
                <span id="gdpValue" class="stat-value text-3xl text-blue-400">100.0</span>
            </div>
            <div class="text-center p-4 bg-gray-900/40 rounded-lg border border-gray-800">
                <span class="text-xs text-gray-400 block mb-1 font-semibold">불평등 지수</span>
                <span id="inequalityValue" class="stat-value text-3xl text-emerald-400">0.450</span>
            </div>
            <div class="text-center p-4 bg-gray-900/40 rounded-lg border border-gray-800">
                <span class="text-xs text-gray-400 block mb-1 font-semibold">AI 생산성</span>
                <span id="productivityValue" class="stat-value text-3xl text-amber-400">10.0</span>
            </div>
        </div>

        <!-- 중단 세션: 핵심 데이터 인포그래픽스 그래프 (정책 선지 위로 이동) -->
        <section class="glass-panel p-6 flex flex-col h-[350px]">
            <h2 class="text-sm font-bold uppercase tracking-wider text-gray-300 mb-3 border-b border-gray-800 pb-2">
                📈 연도별 시뮬레이션 지표 동향 그래프
            </h2>
            <div class="relative w-full flex-grow">
                <canvas id="analyticsChart"></canvas>
            </div>
        </section>
        
        <!-- 하단 세션: 정부 아젠다 정책 선택지 -->
        <section class="glass-panel p-6 flex flex-col">
            <h2 class="text-sm font-bold uppercase tracking-wider text-gray-300 mb-4 border-b border-gray-800 pb-2">
                🎯 정부 아젠다 정책 선택지
            </h2>
            <div id="choicesContainer" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- 자바스크립트 로직에 의해 정책 카드 3개가 가로로 나란히 배치되는 영역 -->
            </div>
        </section>

    </main>

    <!-- 하단 푸터 바 영역 -->
    <footer class="w-full max-w-7xl mx-auto text-center text-xs text-gray-600">
        <p>© 2026 AI Benefit Distribution Simulator. Created for Zero-shot Sample Project.</p>
    </footer>

    <!-- 게임 엔딩 도달 시 출력되는 화면 오버레이 레이어 팝업 -->
    <div id="resultModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
        <div class="glass-panel p-8 max-w-md w-full text-center border-2 border-gray-700 bg-slate-900">
            <h2 id="modalTitle" class="text-3xl font-extrabold text-white mb-4">결과 판정</h2>
            <p id="modalDesc" class="text-gray-300 mb-6 leading-relaxed">상태 메시지</p>
            <button id="modalRestartBtn" class="w-full bg-gradient-to-r from-blue-500 to-emerald-500 text-white font-bold py-3 px-6 rounded-xl hover:opacity-90 shadow-lg shadow-blue-500/20 transition">
                새로운 시뮬레이션 시작하기
            </button>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
